name: Deploy Graphs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: graphify-out # The folder the action should deploy.
          branch: graphs # The branch the action should deploy to.
          clean: true # Automatically remove deleted files from the deploy branch
